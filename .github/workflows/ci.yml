name: Formula CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tap:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4

      - name: Validate formulas
        run: |
          brew style shreyam1008/tap/protopeek
          brew audit --strict shreyam1008/tap/protopeek
          brew style shreyam1008/tap/dbterm
          brew audit --strict shreyam1008/tap/dbterm
          brew readall --aliases --os=all --arch=all shreyam1008/tap

      - name: Install and smoke test both products
        run: |
          set -euo pipefail
          brew install shreyam1008/tap/protopeek
          brew install shreyam1008/tap/dbterm
          brew test shreyam1008/tap/protopeek
          brew test shreyam1008/tap/dbterm
          brew linkage --test shreyam1008/tap/protopeek
          brew linkage --test shreyam1008/tap/dbterm
          protopeek_version="$(brew info --json=v2 shreyam1008/tap/protopeek | python3 -c 'import json,re,sys; v=json.load(sys.stdin)["formulae"][0]["versions"]["stable"]; print(v) if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v) else sys.exit("Missing stable ProtoPeek formula version")')"
          protopeek -version 2>&1 | awk -v expected="v$protopeek_version" '{for (i = 1; i <= NF; i++) if ($i == expected) found = 1} END {exit !found}'
          pp -version 2>&1 | awk -v expected="v$protopeek_version" '{for (i = 1; i <= NF; i++) if ($i == expected) found = 1} END {exit !found}'
          aria2c --version | grep -F 'aria2 version'
          dbterm --version 2>&1 | grep -F 'v0.10.0'
          test -f "$(brew --prefix)/share/man/man1/protopeek.1"
          test -f "$(brew --prefix)/share/man/man1/pp.1"
